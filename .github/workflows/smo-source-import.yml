name: Import complete SMO integration
on:
  push:
    branches: [feat/smo-credit-integration]
    paths: [.github/workflows/smo-source-import.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Import original source and integration files
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError
          from io import BytesIO
          from zipfile import ZipFile
          source = 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-cc60-81f4-a303-2d3ea459828a/raw?se=2026-09-17T15%3A22%3A50Z&sp=r&sv=2026-02-06&sr=b&scid=9f184b97-d5d0-5522-a39c-f69cf17f5f19&skoid=a4604a88-85e4-4562-b6ab-a5622268de80&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-17T08%3A29%3A25Z&ske=2026-09-18T08%3A29%3A25Z&sks=b&skv=2026-02-06&sig=bLo/5SsbNggAzvjZSMvsgpz49XiAMqYq/XaR6Ts18aY%3D'
          print('::add-mask::' + source)
          request = Request(source, headers={'User-Agent': 'Mozilla/5.0', 'Accept': 'application/zip, */*'})
          try:
              with urlopen(request, timeout=90) as response:
                  bundle = response.read()
          except HTTPError as error:
              print('Source transfer failed:', error.code, error.read(1200).decode('utf-8', errors='replace'))
              raise SystemExit(1)
          allowed = {'SMO_INTEGRATION.md', 'scripts/integrate_smo.py', 'src/dashboard/smoNavigation.ts', 'src/dashboard/SmoCreditDashboard.tsx', 'src/dashboard/SmoCreditDashboard.css', 'public/smo/pulse-bridge.js', 'public/smo/pulse-theme.css', 'public/smo/competitive-presentation.html'}
          with ZipFile(BytesIO(bundle)) as archive:
              for item in archive.infolist():
                  if item.filename not in allowed:
                      raise RuntimeError('Unexpected integration path')
                  target = Path(item.filename)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(archive.read(item))
          PY
      - name: Connect native SMO navigation and preserve existing application
        run: python3 scripts/integrate_smo.py
      - name: Commit integration and remove temporary transport
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/smo-source-import.yml
          git add public/smo src/dashboard/SmoCreditDashboard.tsx src/dashboard/SmoCreditDashboard.css src/dashboard/smoNavigation.ts src/dashboard/App.tsx src/dashboard/DashboardHeader.tsx src/dashboard/types.ts src/dashboard/model.ts src/dashboard/presentationNavigation.ts scripts/integrate_smo.py SMO_INTEGRATION.md
          git commit -m 'feat(smo): integrate complete dashboard, native sections and motion [skip ci]'
          git pull --rebase origin feat/smo-credit-integration
          git push origin HEAD:feat/smo-credit-integration
