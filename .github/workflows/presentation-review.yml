name: Presentation review
on:
  push:
    branches: [fix/presentation-responsive-navigation]
  pull_request:
    paths:
      - 'src/dashboard/**'
      - 'scripts/presentation-*.mjs'
      - '.github/workflows/presentation-review.yml'
permissions:
  contents: write
concurrency:
  group: presentation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Integrate verified presentation source
        if: github.event_name == 'push' && github.ref == 'refs/heads/fix/presentation-responsive-navigation'
        run: |
          python3 .github/apply-presentation.py
          git add src/dashboard/App.tsx src/dashboard/SalesModelDeck.tsx src/dashboard/model.ts src/main.tsx
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'fix: integrate responsive presentation and cross-section navigation'
            git push origin HEAD:fix/presentation-responsive-navigation
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --force
      - name: Unit tests
        run: pnpm test
      - name: Type check and production build
        run: pnpm build
      - name: Browser regression tests
        run: |
          npm install --prefix /tmp/presentation-browser --no-package-lock playwright@1.55.1
          /tmp/presentation-browser/node_modules/.bin/playwright install --with-deps chromium webkit
          pnpm exec vite preview --host 127.0.0.1 --port 4176 > /tmp/presentation-preview.log 2>&1 &
          node scripts/presentation-review.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: presentation-review
          path: review-artifacts
          retention-days: 7
