name: Presentation review
on:
  push:
    branches: [master, fix/presentation-responsive-navigation]
  pull_request:
    paths:
      - 'src/dashboard/**'
      - 'scripts/presentation-*.mjs'
      - '.github/workflows/presentation-review.yml'
permissions:
  contents: read
concurrency:
  group: presentation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --force
      - name: Unit tests
        run: pnpm test
      - name: Type check and production build
        run: pnpm build
      - name: Browser regression tests
        run: |
          npm install --prefix /tmp/presentation-browser --no-package-lock playwright@1.55.1
          /tmp/presentation-browser/node_modules/.bin/playwright install --with-deps chromium webkit
          pnpm exec vite preview --host 127.0.0.1 --port 4176 > /tmp/presentation-preview.log 2>&1 &
          node scripts/presentation-review.mjs
          node scripts/presentation-motion-review.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: presentation-review
          path: review-artifacts
          retention-days: 7
