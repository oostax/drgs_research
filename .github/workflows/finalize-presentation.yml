name: Finalize approved presentation
on:
  push:
    branches: [fix/presentation-responsive-navigation]
    paths: ['.github/workflows/finalize-presentation.yml']
permissions:
  contents: write
concurrency:
  group: finalize-approved-presentation
  cancel-in-progress: false
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/presentation-responsive-navigation
          fetch-depth: 1
      - name: Verify and apply approved patch
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, pathlib, subprocess
          encoded = ''.join(pathlib.Path(f'.review/presentation-{n}.b64').read_text().strip() for n in (1,2,3))
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'b3f24110646d060ebdf4abbf1f6e4f6c2a46c8692e4539c93496a98d83209fce', 'Patch checksum mismatch'
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --force
      - name: All unit tests
        run: pnpm test
      - name: Type check and production build
        run: pnpm build
      - name: Chromium and WebKit integration and visual checks
        run: |
          npm install --prefix /tmp/presentation-browser --no-package-lock playwright@1.55.1
          /tmp/presentation-browser/node_modules/.bin/playwright install --with-deps chromium webkit
          pnpm exec vite preview --host 127.0.0.1 --port 4176 > /tmp/presentation-preview.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4176/ > /dev/null && break; sleep 1; done
          node scripts/presentation-review.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-presentation-review
          path: review-artifacts
          retention-days: 7
      - name: Commit tested source changes without overwriting concurrent work
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/dashboard scripts/presentation-review.mjs
          git rm .review/presentation-1.b64 .review/presentation-2.b64 .review/presentation-3.b64
          git diff --cached --check
          git commit -m 'fix: responsive presentation, semantic motion and continuous navigation'
          git push origin HEAD:fix/presentation-responsive-navigation
          git rev-parse HEAD
