name: Academy integration publication
on:
  push:
    branches: [work/academy-integration-20260917]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/academy-integration-20260917
      - name: Apply prepared integration
        run: node scripts/integrate-academy.mjs
      - name: Commit integrated source
        run: |
          git config user.name "oostax"
          git config user.email "oostax@users.noreply.github.com"
          git add src/dashboard public/academy
          if ! git diff --cached --quiet; then
            git commit -m "Connect Academy page to shared presentation navigation"
            git push origin HEAD:work/academy-integration-20260917
          fi
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build
        run: npm install --force --no-package-lock --no-audit --no-fund && npm run build
      - name: Tests
        run: npm test
